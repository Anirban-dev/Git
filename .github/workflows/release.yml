name: Release MiniGit Standalone Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Binary for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            arch: x86_64
            runner: windows-latest
            artifact_name: minigit-windows-x86_64.exe
            pyinstaller_args: --onefile --name minigit-windows-x86_64 minigit.py
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            artifact_name: minigit-linux-x86_64
            pyinstaller_args: --onefile --name minigit-linux-x86_64 minigit.py
          - os: macos
            arch: x86_64
            runner: macos-13
            artifact_name: minigit-macos-x86_64
            pyinstaller_args: --onefile --name minigit-macos-x86_64 minigit.py
          - os: macos
            arch: arm64
            runner: macos-14
            artifact_name: minigit-macos-arm64
            pyinstaller_args: --onefile --name minigit-macos-arm64 minigit.py

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Binary with PyInstaller
        run: |
          pyinstaller ${{ matrix.pyinstaller_args }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-binaries/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish / Update Latest Tag Assets (on main branch push)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Build
          draft: false
          prerelease: false
          files: release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
